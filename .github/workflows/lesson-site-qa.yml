name: Lesson site QA

on:
  push:
    branches: [ main, "v4-progressive-visual-overhaul-2026-09-23" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/diagrams.js
          node --check assets/js/diagram-upgrades.js
          node --check assets/js/visual-lessons.js
          node --check data/lessons.js
          node --check data/v4-overrides.js
          for f in data/enrichment/*.js; do node --check "$f"; done
      - name: Validate lesson data
        run: node scripts/qa.mjs
      - name: Verify page assets
        run: |
          test -f index.html
          test -f assets/css/site.css
          test -f assets/images/nes-logo.svg
          test -f data/source-alignment.json
          test -f assets/js/visual-lessons.js
          ! grep -q "textbooks.js" index.html
          ! grep -q "pdf.min.js" index.html
